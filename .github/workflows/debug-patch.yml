##############################################################################
# 临时调试工作流：只检查补丁能不能应用到干净的核心上（不编译，1 分钟出结果）
# 用完就删（构建工作流不受影响）
##############################################################################
name: Debug patch

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: windows-2022
    steps:
      - name: 拉取核心源码
        uses: actions/checkout@v4
        with:
          repository: Conquest-of-AzerothCore/azerothcore-wotlk-coa
          ref: main
          path: a
          fetch-depth: 1

      - name: 取回构建补丁
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          path: meta
          fetch-depth: 1
          sparse-checkout: ci

      - name: 诊断补丁
        shell: pwsh
        working-directory: a
        run: |
          $patch = Join-Path $env:GITHUB_WORKSPACE 'meta\ci\patches\0002-playerbots-companion-loot.patch'
          Write-Host "补丁路径: $patch"
          Write-Host "存在: $(Test-Path $patch)"
          $bytes = [System.IO.File]::ReadAllBytes($patch)
          $crlf = 0; $lf = 0
          for ($i = 0; $i -lt $bytes.Length; $i++) {
            if ($bytes[$i] -eq 10) { $lf++; if ($i -gt 0 -and $bytes[$i-1] -eq 13) { $crlf++ } }
          }
          Write-Host ("大小 {0} 字节 | 前 6 字节 {1} | CRLF {2} | LF {3}" -f $bytes.Length, (($bytes[0..5] | ForEach-Object { $_.ToString('X2') }) -join ' '), $crlf, $lf)

          Write-Host '=== git 版本'
          git --version
          Write-Host '=== autocrlf'
          git config --get core.autocrlf
          Write-Host '=== 目标文件换行'
          $target = 'src/server/coa/AscensionCompat.cpp'
          if (Test-Path $target) {
            $tb = [System.IO.File]::ReadAllBytes($target)
            $tcrlf = 0
            for ($i = 0; $i -lt $tb.Length; $i++) { if ($tb[$i] -eq 10 -and $i -gt 0 -and $tb[$i-1] -eq 13) { $tcrlf++ } }
            Write-Host "$target 大小 $($tb.Length) | CRLF $tcrlf"
          } else { Write-Host "目标文件不存在: $target" }

          Write-Host '=== git apply --check -v'
          git apply --check -v "$patch" 2>&1 | ForEach-Object { Write-Host $_ }
          Write-Host "exit=$LASTEXITCODE"

          Write-Host '=== 换成 LF 再试'
          $lfPatch = Join-Path $env:RUNNER_TEMP 'patch-lf.patch'
          $text = [System.IO.File]::ReadAllText($patch)
          $text = $text.Replace("`r`n", "`n")
          [System.IO.File]::WriteAllText($lfPatch, $text, (New-Object System.Text.UTF8Encoding $false))
          git apply --check -v "$lfPatch" 2>&1 | ForEach-Object { Write-Host $_ }
          Write-Host "exit=$LASTEXITCODE"
