##############################################################################
# lrrry 自用版云编译（Windows）—— core + CoA Bots + 三个额外模块
#
# 放在自己 fork 仓库的 .github/workflows/build-lrrry-windows.yml，
# Actions → Build lrrry (Windows) → Run workflow。
#
# 产物 lrrry-core-windows-rNN.zip：
#   authserver.exe / worldserver.exe / 运行时 DLL / configs（模块 .conf.dist）/ BUILD_INFO.txt
# 下载后交给 tools\lrrry-cloud.mjs 里的 pack 子命令做成更新包。
##############################################################################
name: Build lrrry (Windows)

on:
  workflow_dispatch:
    inputs:
      core_repo:
        description: '核心仓库 owner/repo（留空 = Conquest-of-AzerothCore/azerothcore-wotlk-coa）'
        required: false
        default: ''
      core_ref:
        description: '核心分支/标签/commit（留空 = main）'
        required: false
        default: ''
      module_ref:
        description: 'mod-playerbots 分支（留空 = coa）'
        required: false
        default: ''
      build_type:
        description: '构建类型'
        type: choice
        options:
          - 'RelWithDebInfo'
          - 'Release'
        default: 'RelWithDebInfo'

permissions:
  # By lrrry 2026-11-12: 要往 Releases 上传产物（登录器从 Release 读，公开仓库不用 token）
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 355
    env:
      # BOOST_ROOT 由「安装 Ninja 与 Boost」那步动态写入（复用 runner 上已有的版本）
      CMAKE_GENERATOR: Ninja
      MYSQL_VERSION: 8.4.13
      OPENSSL_VERSION: 3.6.5
    steps:
      - name: 拉取核心源码
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.core_repo || 'Conquest-of-AzerothCore/azerothcore-wotlk-coa' }}
          ref: ${{ inputs.core_ref || 'main' }}
          path: a
          fetch-depth: 0

      - name: 拉取 mod-playerbots
        uses: actions/checkout@v4
        with:
          repository: Zyth45/mod-playerbots
          ref: ${{ inputs.module_ref || 'coa' }}
          path: a/modules/mod-playerbots
          fetch-depth: 1

      # By lrrry 2026-11-14
      # 不再拉 mod-ah-bot-plus：官方整合包从 3.0 起把拍卖行机器人并进了 mod-playerbots
      # （modules/mod-playerbots/conf/mod_ahbot.conf.dist），再挂外挂会出现两套 AHBot。
      - name: 拉取 mod-dungeon-clear
        uses: actions/checkout@v4
        with:
          repository: Zyth45/mod-dungeon-clear
          ref: coa
          path: a/modules/mod-dungeon-clear
          fetch-depth: 1

      - name: 拉取 mod-npc-enchanter
        uses: actions/checkout@v4
        with:
          repository: azerothcore/mod-npc-enchanter
          ref: master
          path: a/modules/mod-npc-enchanter
          fetch-depth: 1

      # By lrrry 2026-11-14
      # SquidBotsLite 是每次更新都会变的新插件，玩家用的就是它。
      # 它自带多语言机制（STRINGS = { en = {...}, fr = {...} }），所以这里拉下来后
      # 用 ci/tools/lrrry-addon-cn.mjs 补一份 zh 表，再打进产物，
      # 客户端落地后直接是中文，不用每次手工翻译。
      - name: 拉取 SquidBotsLite 插件
        uses: actions/checkout@v4
        with:
          repository: Zyth45/squidbots-addon
          ref: main
          path: a/addons/squidbots-addon
          fetch-depth: 1

      - name: 取回构建补丁
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          path: meta
          fetch-depth: 1
          sparse-checkout: ci

      - name: 放入额外模块
        shell: pwsh
        run: |
          # By lrrry 2026-11-12
          # DevMenu（GM 菜单）服务端模块没有可靠的公开仓库可拉，源码直接放在本仓库 ci/modules 下，
          # 编译前复制进 core 的 modules 目录；AzerothCore 会自动收录（ModulesLoader 里会出现
          # Addmod_ilusixn_devmenuScripts）。
          $src = Join-Path $env:GITHUB_WORKSPACE 'meta\ci\modules'
          if (-not (Test-Path $src)) { Write-Host '本仓库没有 ci/modules，跳过'; exit 0 }
          $dst = 'a\modules'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Get-ChildItem $src -Directory | ForEach-Object {
            $target = Join-Path $dst $_.Name
            if (Test-Path $target) { Remove-Item $target -Recurse -Force }
            Copy-Item $_.FullName $target -Recurse -Force
            Write-Host "已放入模块：$($_.Name)"
          }

      - name: 应用构建补丁
        shell: bash
        working-directory: a
        run: |
          shopt -s nullglob
          applied=0
          # By lrrry 2026-11-12
          # 教训：Windows runner 上的 checkout 会把 .patch 转成 CRLF（仓库没有 .gitattributes 时
          # core.autocrlf=true 生效），git apply 对 CRLF 的补丁一律「patch does not apply」，
          # 于是两个补丁都被 skip，编译时找不到 AscensionCompanionLoot.h。
          # 这里先统一转成 LF 再打；仓库里也加了 .gitattributes（*.patch -text）。
          mkdir -p "$RUNNER_TEMP/patches"
          for patch in "$GITHUB_WORKSPACE"/meta/ci/patches/*.patch; do
            name=$(basename "$patch")
            sed 's/\r$//' "$patch" > "$RUNNER_TEMP/patches/$name"
            # By lrrry 2026-11-13
            # 上游每天都有提交，补丁里的行号会漂。先按原样打，失败再放宽到「只匹配 1 行上下文」（-C1），
            # 免得上游在相邻位置加了两行就让 0003 静默 skip、云端产物一落地就 ASSERT。
            if git apply --check "$RUNNER_TEMP/patches/$name" 2>/dev/null; then
              git apply "$RUNNER_TEMP/patches/$name"
              echo "applied: $name"
              applied=$((applied + 1))
            elif git apply --check -C1 "$RUNNER_TEMP/patches/$name" 2>/dev/null; then
              git apply -C1 "$RUNNER_TEMP/patches/$name"
              echo "applied (-C1): $name"
              applied=$((applied + 1))
            else
              echo "skip (already applied or not applicable): $name"
            fi
          done
          echo "手动补丁应用数量: $applied"
          if [ "$applied" -eq 0 ]; then
            echo "::warning::一个补丁都没打上，编译会因为缺 AscensionCompanionLoot.h 失败"
          fi
          # End By lrrry 2026-11-12

      - name: 移动到短路径 C:\ac
        shell: pwsh
        run: |
          if (Test-Path C:\ac) { Remove-Item C:\ac -Recurse -Force }
          New-Item -ItemType Directory -Path C:\ac | Out-Null
          robocopy "${{ github.workspace }}\a" "C:\ac" /MIR /NFL /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -le 7) { exit 0 }
          exit $LASTEXITCODE

      - name: 记录版本
        shell: bash
        run: |
          CORE_COMMIT=$(git -C /c/ac rev-parse HEAD)
          CORE_DATE=$(git -C /c/ac log -1 --format=%cd --date=format:%Y%m%d)
          MOD_COMMIT=$(git -C /c/ac/modules/mod-playerbots rev-parse HEAD)
          {
            echo "### 本次编译"
            echo ""
            echo "| 来源 | commit |"
            echo "|---|---|"
            echo "| core | \`$CORE_COMMIT\` |"
            echo "| mod-playerbots | \`$MOD_COMMIT\` |"
            echo ""
            echo "- releaseId：\`main-$CORE_DATE-${CORE_COMMIT:0:8}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "CORE_COMMIT=$CORE_COMMIT" >> "$GITHUB_ENV"
          echo "CORE_DATE=$CORE_DATE" >> "$GITHUB_ENV"
          echo "MOD_COMMIT=$MOD_COMMIT" >> "$GITHUB_ENV"
          echo "RELEASE_ID=main-$CORE_DATE-${CORE_COMMIT:0:8}" >> "$GITHUB_ENV"

      - name: 缓存 Boost
        uses: actions/cache@v4
        with:
          path: C:\local\boost_1_87_0
          # By lrrry 2026-11-12: key 加 -v2。第一次跑时缓存里存的是「只有头文件」的空壳
          # （runner 预装的 C:\local\boost_1_87_0 只有 boost/ 没有 lib64-msvc-14.3），
          # 旧 key 一旦存在就不会更新，每次都会恢复空壳再重装 15 分钟。换 key 让它重新存。
          key: win-deps-boost-1.87.0-lib64-v2

      - name: 缓存 MySQL 客户端
        uses: actions/cache@v4
        with:
          path: C:\tools\mysql\current
          key: win-deps-mysql-8.4.13-v1

      - name: 缓存 Win64 OpenSSL
        uses: actions/cache@v4
        with:
          path: C:\openssl
          key: win-deps-openssl-3.6.5

      - name: 安装 Ninja 与 Boost
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install ninja -y --no-progress
          # By lrrry 2026-11-12
          # 不再死磕 1.87：runner 的 C:\local 里往往已经躺着可用的 Boost（只是版本不同、布局是
          # lib64-msvc-14.x）。ACE 只要求 >= 1.78，所以先扫一遍能用的（头文件 + 库目录都在），
          # 直接用；一个都没有才下载安装。这样每轮能省掉 15~20 分钟。
          $cand = Get-ChildItem 'C:\local' -Directory -Filter 'boost_1_*' -ErrorAction SilentlyContinue |
            Sort-Object Name -Descending
          $root = $null
          $libDir = $null
          foreach ($dir in $cand) {
            if (-not (Test-Path (Join-Path $dir.FullName 'boost\version.hpp'))) { continue }
            $lib = Get-ChildItem $dir.FullName -Directory -Filter 'lib64-msvc-*' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($lib) { $root = $dir.FullName; $libDir = $lib.FullName; break }
          }
          if (-not $root) {
            $exe = Join-Path $env:RUNNER_TEMP 'boost.exe'
            $urls = @(
              'https://archives.boost.io/release/1.87.0/binaries/boost_1_87_0-msvc-14.3-64.exe',
              'https://downloads.sourceforge.net/project/boost/boost-binaries/1.87.0/boost_1_87_0-msvc-14.3-64.exe'
            )
            $done = $false
            foreach ($url in $urls) {
              try {
                Invoke-WebRequest -Uri $url -OutFile $exe -UserAgent 'lrrry-ci' -MaximumRetryCount 2 -RetryIntervalSec 10
                if ((Get-Item $exe).Length -gt 100MB) { $done = $true; break }
              } catch { Write-Warning "下载失败：$url（$($_.Exception.Message)）" }
            }
            if (-not $done) { throw 'Boost 安装包下载失败（archives 与 sourceforge 都试过了）' }
            Start-Process -FilePath $exe -Wait -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/DIR=C:\local\boost_1_87_0')
            $root = 'C:\local\boost_1_87_0'
            $lib = Get-ChildItem $root -Directory -Filter 'lib64-msvc-*' -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not (Test-Path "$root\boost\version.hpp") -or -not $lib) { throw 'Boost 安装后仍不完整（头文件或 lib64-msvc 缺失）' }
            $libDir = $lib.FullName
          }
          Write-Host "Boost root: $root"
          Write-Host "Boost lib : $libDir"
          "BOOST_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "BOOST_LIB_DIR=$libDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # End By lrrry 2026-11-12

      - name: 安装 MySQL 8.4.13 客户端库
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = $env:MYSQL_VERSION
          $cur = 'C:\tools\mysql\current'
          if (-not (Test-Path "$cur\lib\mysqlclient.lib")) {
            $url = "https://cdn.mysql.com/Downloads/MySQL-8.4/mysql-$ver-winx64.zip"
            $zip = Join-Path $env:RUNNER_TEMP 'mysql.zip'
            Invoke-WebRequest -Uri $url -OutFile $zip -UserAgent 'Mozilla/5.0' -MaximumRetryCount 3 -RetryIntervalSec 10
            if ((Get-Item $zip).Length -lt 50MB) { throw 'MySQL 包体积异常' }
            New-Item -ItemType Directory -Force -Path 'C:\tools\mysql' | Out-Null
            Expand-Archive -Path $zip -DestinationPath 'C:\tools\mysql' -Force
            $dir = Get-ChildItem 'C:\tools\mysql' -Directory -Filter "mysql-$ver-*" | Select-Object -First 1
            if (-not $dir) { throw "解压后没找到 mysql-$ver-winx64" }
            Rename-Item $dir.FullName $cur
          }
          $vh = "$cur\include\mysql_version.h"
          $idLine = Select-String -Path $vh -Pattern '^#define\s+MYSQL_VERSION_ID\s+(\d+)' | Select-Object -First 1
          if (-not $idLine) { throw '无法判定 MySQL 版本' }
          $id = [int]$idLine.Matches[0].Groups[1].Value
          $actual = '{0}.{1}.{2}' -f ([math]::Floor($id / 10000)), ([math]::Floor(($id % 10000) / 100)), ($id % 100)
          if ($actual -ne $ver) { throw "MySQL 实际 $actual，不是 $ver" }

      - name: 安装 Win64 OpenSSL 3.6.5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = $env:OPENSSL_VERSION
          $root = 'C:\openssl'
          # By lrrry 2026-11-12
          # 原来装 slproweb 的 MSI + INSTALLDIR：runner 上 msiexec 返回 0，却把 OpenSSL 装回了
          # Program Files（INSTALLDIR 被忽略），C:\openssl 里什么都没有，CMake 就报
          # Could NOT find OpenSSL。现在：先看 C:\openssl，再看 runner 预装的位置，
          # 都没有才下载 zip 解压，最后统一落到 C:\openssl 并校验 ssl.h。
          if (-not (Test-Path "$root\include\openssl\ssl.h")) {
            $preset = @('C:\Program Files\OpenSSL-Win64', 'C:\Program Files\OpenSSL', 'C:\Program Files (x86)\OpenSSL-Win64') |
              Where-Object { Test-Path "$_\include\openssl\ssl.h" } | Select-Object -First 1
            if ($preset) {
              Write-Host "复用 runner 预装的 OpenSSL：$preset"
              New-Item -ItemType Directory -Force -Path $root | Out-Null
              robocopy $preset $root /E /NFL /NDL /NJH /NJS /NP | Out-Null
              if ($LASTEXITCODE -ge 8) { throw "复制预装 OpenSSL 失败：$LASTEXITCODE" }
              # robocopy 成功也返回 1，PowerShell 会把它当脚本退出码 → step 失败。必须清零。
              $LASTEXITCODE = 0
            } else {
              $zip = Join-Path $env:RUNNER_TEMP "openssl-$ver.zip"
              $url = "https://download.firedaemon.com/FireDaemon-OpenSSL/openssl-$ver.zip"
              Write-Host "下载 $url"
              Invoke-WebRequest -Uri $url -OutFile $zip -UserAgent 'Mozilla/5.0' -MaximumRetryCount 3 -RetryIntervalSec 10
              if ((Get-Item $zip).Length -lt 10MB) { throw 'OpenSSL 包体积异常' }
              $tmp = Join-Path $env:RUNNER_TEMP 'openssl-x'
              if (Test-Path $tmp) { Remove-Item $tmp -Recurse -Force }
              Expand-Archive -Path $zip -DestinationPath $tmp -Force
              $x64 = Get-ChildItem $tmp -Directory -Recurse -Filter 'x64' | Select-Object -First 1
              if (-not $x64) { throw 'OpenSSL 包里没有 x64 目录' }
              if (Test-Path $root) { Remove-Item $root -Recurse -Force }
              New-Item -ItemType Directory -Force -Path $root | Out-Null
              robocopy $x64.FullName $root /E /NFL /NDL /NJH /NJS /NP | Out-Null
              if ($LASTEXITCODE -ge 8) { throw "解压 OpenSSL 失败：$LASTEXITCODE" }
              $LASTEXITCODE = 0
            }
          }
          if (-not (Test-Path "$root\include\openssl\ssl.h")) { throw "OpenSSL 装好后仍找不到 $root\include\openssl\ssl.h" }
          Write-Host "OpenSSL root: $root"
          "OPENSSL_ROOT_DIR=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # End By lrrry 2026-11-12

      - name: 启用 MSVC 环境
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64

      - name: CMake 配置
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\ac\var\build | Out-Null
          cmake -S C:\ac -B C:\ac\var\build -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ inputs.build_type }} `
            -DCMAKE_INSTALL_PREFIX=C:/ac/env/dist `
            -DSCRIPTS=static -DMODULES=static -DAPPS_BUILD=all -DTOOLS_BUILD=none `
            -DBUILD_TESTING=OFF -DWITH_WARNINGS=OFF `
            -DBOOST_ROOT="$($env:BOOST_ROOT -replace '\\','/')" -DBoost_ROOT="$($env:BOOST_ROOT -replace '\\','/')" `
            -DBoost_INCLUDE_DIR="$($env:BOOST_ROOT -replace '\\','/')" -DBoost_LIBRARY_DIR="$($env:BOOST_LIB_DIR -replace '\\','/')" `
            -DBoost_ADDITIONAL_VERSIONS="1.87;1.87.0;1.86;1.86.0;1.85;1.85.0;1.84;1.84.0;1.83;1.83.0" `
            -DBoost_NO_BOOST_CMAKE=ON `
            -DOPENSSL_ROOT_DIR=C:/openssl -DOPENSSL_USE_STATIC_LIBS=FALSE `
            -DMYSQL_INCLUDE_DIR=C:/tools/mysql/current/include -DMYSQL_LIBRARY=C:/tools/mysql/current/lib/libmysql.lib `
            -DCMAKE_RC_COMPILER=rc -DCMAKE_NINJA_FORCE_RESPONSE_FILE=ON -DCMAKE_NINJA_CMCLDEPS_RC=OFF
          if ($LASTEXITCODE -ne 0) { throw 'CMake 配置失败' }

      - name: 校验额外模块已收录
        shell: pwsh
        run: |
          # By lrrry 2026-11-14
          # 用户决定与官方整合包零偏差，DevMenu 已从 ci/modules 移除，这里改成通用校验：
          # 只要 ci/modules 下有模块，就必须出现在 ModulesLoader.cpp 里，否则直接失败，
          # 不用等 90 分钟编到链接阶段才发现。
          $loader = 'C:\ac\var\build\modules\gen_scriptloader\static\ModulesLoader.cpp'
          if (-not (Test-Path $loader)) { throw "没找到 ModulesLoader.cpp：$loader" }
          $extra = 'a\modules'
          $expected = @()
          $meta = Join-Path $env:GITHUB_WORKSPACE 'meta\ci\modules'
          if (Test-Path $meta) {
            $expected = @(Get-ChildItem $meta -Directory | ForEach-Object { $_.Name })
          }
          if ($expected.Count -eq 0) {
            Write-Host 'ci/modules 下没有额外模块，跳过校验（与官方模块集一致）'
            exit 0
          }
          $missing = @()
          foreach ($name in $expected) {
            # mod-ilusixn-devmenu -> Addmod_ilusixn_devmenuScripts
            $key = ($name -replace '^mod[-_]', '') -replace '-', '_'
            if (-not (Select-String -Path $loader -Pattern ("Addmod_" + $key + "Scripts") -Quiet)) { $missing += $name }
          }
          if ($missing.Count) { throw ("这些模块没有被收录：" + ($missing -join ', ')) }
          Write-Host ("额外模块已收录：" + ($expected -join ', '))

      - name: 编译并安装
        shell: pwsh
        run: |
          cmake --build C:\ac\var\build --target install -j 8 2>&1 | Tee-Object -FilePath C:\ac\build.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path C:\ac\build.log -Pattern 'error C|error LNK|fatal error|FAILED:' | Select-Object -Last 30 | ForEach-Object { $_.Line }
            throw "编译失败（exit $LASTEXITCODE）"
          }

      - name: 补齐运行时 DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = 'C:\ac\env\dist'
          if (-not (Test-Path "$dist\worldserver.exe")) { throw 'env/dist 没有 worldserver.exe' }
          $cand = [ordered]@{
            'libmysql.dll'        = @('C:\tools\mysql\current\lib', 'C:\tools\mysql\current\bin')
            'libcrypto-3-x64.dll' = @('C:\openssl\bin')
            'libssl-3-x64.dll'    = @('C:\openssl\bin')
            'legacy.dll'          = @('C:\openssl\bin')
            'vcruntime140.dll'    = @('C:\Windows\System32')
            'vcruntime140_1.dll'  = @('C:\Windows\System32')
            'msvcp140.dll'        = @('C:\Windows\System32')
            'msvcp140_1.dll'      = @('C:\Windows\System32')
            'msvcp140_2.dll'      = @('C:\Windows\System32')
            'concrt140.dll'       = @('C:\Windows\System32')
            'vccorlib140.dll'     = @('C:\Windows\System32')
          }
          foreach ($n in $cand.Keys) {
            if (Test-Path (Join-Path $dist $n)) { continue }
            $src = @($cand[$n]) | Where-Object { Test-Path (Join-Path $_ $n) } | Select-Object -First 1
            if ($src) { Copy-Item (Join-Path $src $n) $dist -Force } else { Write-Warning "缺 $n" }
          }
          $dll = Join-Path $dist 'libmysql.dll'
          if (-not (Test-Path $dll)) { throw 'env/dist 没有 libmysql.dll' }
          $fv = (Get-Item $dll).VersionInfo.FileVersion
          if ($fv -notlike "$env:MYSQL_VERSION*") { throw "libmysql.dll 是 $fv，与 $env:MYSQL_VERSION 不一致（ACE00046）" }

      - name: 写入 BUILD_INFO.txt
        shell: pwsh
        run: |
          $lines = @(
            'lrrry-coa-Repack 云编译',
            '======================='
            "release_id    = $env:RELEASE_ID"
            "built_at      = $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss zzz')"
            ''
            'core_repo     = https://github.com/Conquest-of-AzerothCore/azerothcore-wotlk-coa'
            "core_commit   = $env:CORE_COMMIT"
            "module_commit = $env:MOD_COMMIT"
            'modules       = mod-playerbots, mod-dungeon-clear, mod-npc-enchanter + core 自带模块'
            ''
            'build_type    = ${{ inputs.build_type }}'
            'mysql_client  = 8.4.13'
            "openssl       = $env:OPENSSL_ROOT_DIR"
            "boost         = $env:BOOST_ROOT"
          )
          $lines | Out-File -FilePath 'C:\ac\env\dist\BUILD_INFO.txt' -Encoding utf8

      - name: 打包产物
        shell: pwsh
        run: |
          $pkg = 'C:\ac\pkg'
          if (Test-Path $pkg) { Remove-Item $pkg -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item 'C:\ac\env\dist\*' $pkg -Recurse -Force
          Remove-Item (Join-Path $pkg 'Logs') -Recurse -Force -ErrorAction SilentlyContinue
          # By lrrry 2026-11-14
          # SquidBotsLite 汉化后一起打进产物：落地到 CoA-Bots\Client\SquidBotsLite，
          # coa_update.py 会把它复制到客户端 Interface\AddOns，玩家进游戏就是中文。
          # 插件自带多语言表，汉化只补 STRINGS.zh 并让 lang 认识 zhCN，不动任何业务逻辑。
          $addonSrc = 'a\addons\squidbots-addon\SquidBotsLite'
          if (Test-Path $addonSrc) {
            $cnTool = Join-Path $env:GITHUB_WORKSPACE 'meta\ci\tools\lrrry-addon-cn.mjs'
            $cnDict = Join-Path $env:GITHUB_WORKSPACE 'meta\ci\tools\lrrry-addon-zh.json'
            node $cnTool --src $addonSrc --dict $cnDict
            if ($LASTEXITCODE -ne 0) { throw '插件汉化失败' }
            $clientRoot = Join-Path $pkg 'CoA-Bots\Client'
            New-Item -ItemType Directory -Force -Path $clientRoot | Out-Null
            Copy-Item $addonSrc (Join-Path $clientRoot 'SquidBotsLite') -Recurse -Force
            $toc = Get-Content (Join-Path $clientRoot 'SquidBotsLite\SquidBotsLite.toc') -ErrorAction SilentlyContinue
            Write-Host "已打入汉化后的 SquidBotsLite（$($toc | Where-Object { $_ -match '^## Version' })）"
          } else {
            Write-Warning "没找到插件源码 a\addons\squidbots-addon\SquidBotsLite"
          }
          # End By lrrry 2026-11-14
          # By lrrry 2026-11-14
          # SQL 要跟着产物走，而且要「完整」。
          # 世界服务器启动时按 Source\sql-tree 自动补表结构和数据；repack 里这份是从 core 源码复制的。
          # 云产物只带 updates 时，从很老的版本升级会缺 archive 里被合并掉的历史脚本，
          # DBUpdater 的 checksum 校验就对不上。所以这里把整个 a\data\sql 打进去
          # （base / updates / archive / create / custom），各模块的 data 也一并带上。
          $sqlTree = Join-Path $pkg 'Source\sql-tree'
          $dataSql = 'a\data\sql'
          if (Test-Path $dataSql) {
            New-Item -ItemType Directory -Force -Path (Join-Path $sqlTree 'data') | Out-Null
            Copy-Item $dataSql (Join-Path $sqlTree 'data\sql') -Recurse -Force
            $count = (Get-ChildItem (Join-Path $sqlTree 'data\sql') -Recurse -File).Count
            $size = [math]::Round(((Get-ChildItem (Join-Path $sqlTree 'data\sql') -Recurse -File | Measure-Object Length -Sum).Sum / 1MB), 1)
            Write-Host "已打入完整核心 SQL 树：$count 个文件 / $size MB"
          } else {
            Write-Warning "没找到 a\data\sql，产物将不含 SQL"
          }
          $mods = 0
          Get-ChildItem 'a\modules' -Directory -ErrorAction SilentlyContinue | ForEach-Object {
            $modData = Join-Path $_.FullName 'data'
            if (-not (Test-Path $modData)) { return }
            $target = Join-Path $sqlTree "modules\$($_.Name)\data"
            New-Item -ItemType Directory -Force -Path (Split-Path $target -Parent) | Out-Null
            Copy-Item $modData $target -Recurse -Force
            $mods++
          }
          Write-Host "已打入模块 SQL：$mods 个模块"
          # End By lrrry 2026-11-14

          # By lrrry 2026-11-14
          # 升级文件：把这次使用的 core 提交、模块提交、以及相对上一个 release 的提交清单写进产物。
          # 登录器落地时会把它放进 repack 的 BUILD_INFO.txt / RELEASE_NOTES.md，玩家能看到改了什么。
          $notes = Join-Path $pkg 'RELEASE_NOTES.md'
          $coreSha = (git -C a rev-parse HEAD).Trim()
          $pbSha = (git -C 'a/modules/mod-playerbots' rev-parse HEAD).Trim()
          $dcSha = (git -C 'a/modules/mod-dungeon-clear' rev-parse HEAD).Trim()
          $neSha = (git -C 'a/modules/mod-npc-enchanter' rev-parse HEAD).Trim()
          $lines = @(
            "# $env:RELEASE_ID",
            "",
            "核心提交：$coreSha",
            "机器人模块：$pbSha",
            "副本清理模块：$dcSha",
            "附魔师模块：$neSha",
            "",
            "## 核心变更",
            ""
          )
          $lines += (git -C a log -20 --pretty=format:'- %s (%h)' | ForEach-Object { $_ })
          $lines += @("", "## 机器人模块变更", "")
          $lines += (git -C 'a/modules/mod-playerbots' log -10 --pretty=format:'- %s (%h)' | ForEach-Object { $_ })
          $lines | Out-File -FilePath $notes -Encoding utf8
          Write-Host "已写入升级文件 RELEASE_NOTES.md"
          # End By lrrry 2026-11-14

          $files = @(Get-ChildItem $pkg -File | Sort-Object Name)
          ($files | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }) |
            Out-File -FilePath (Join-Path $pkg 'SHA256SUMS.txt') -Encoding utf8
          "release_id=$env:RELEASE_ID" | Out-File -FilePath (Join-Path $pkg 'RELEASE_ID.txt') -Encoding ascii

      - name: 上传产物
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: lrrry-core-windows-r${{ github.run_number }}
          path: C:\ac\pkg
          if-no-files-found: error
          retention-days: 30
          compression-level: 1
          overwrite: true

      - name: 打成发布用的 zip
        shell: pwsh
        run: |
          # By lrrry 2026-11-12
          # 登录器不读 artifact（下载要 token），只读 Release 里的这个 zip：
          # 公开仓库的 release asset 可以直接下，配 gh-proxy 中转就能加速。
          $zip = "C:\ac\lrrry-core-$env:RELEASE_ID.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path 'C:\ac\pkg\*' -DestinationPath $zip -CompressionLevel Optimal
          $mb = [math]::Round((Get-Item $zip).Length / 1MB, 1)
          Write-Host "产物 zip: $zip ($mb MB)"
          "ZIP_PATH=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_ID }}
          name: ${{ env.RELEASE_ID }}
          body: |
            云编译产物：core + CoA Bots + mod-playerbots / mod-dungeon-clear / mod-npc-enchanter（含完整 SQL 树与汉化插件）

            - release_id: ${{ env.RELEASE_ID }}
            - core: ${{ env.CORE_COMMIT }}
            - mod-playerbots: ${{ env.MOD_COMMIT }}
          files: ${{ env.ZIP_PATH }}
          fail_on_unmatched_files: true

      - name: 记录下载信息
        shell: pwsh
        run: |
          "### 产物" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "releaseId = ``$env:RELEASE_ID``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "Release 页面: https://github.com/${{ github.repository }}/releases/tag/$env:RELEASE_ID" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "下载（直连）: https://github.com/${{ github.repository }}/releases/download/$env:RELEASE_ID/lrrry-core-$env:RELEASE_ID.zip" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "Artifact: ${{ steps.upload.outputs.artifact-url }}" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
